<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430">
<defs>
<radialGradient id="bg"><stop stop-color="#18104a"/><stop offset=".5" stop-color="#070b20"/><stop offset="1" stop-color="#010207"/></radialGradient>
<linearGradient id="n"><stop stop-color="#00eaff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff3cac"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M55 0H0V55" fill="none" stroke="#4b5275" opacity=".28"/></pattern>
</defs>
<rect width="1400" height="430" rx="30" fill="url(#bg)"/><rect width="1400" height="430" fill="url(#grid)"/>
<g filter="url(#g)">
<circle cx="160" cy="90" r="3" fill="#00eaff"><animate attributeName="cy" values="90;350;90" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="1240" cy="330" r="3" fill="#ff3cac"><animate attributeName="cy" values="330;70;330" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="90" r="3" fill="#8b5cf6"><animate attributeName="cx" values="1080;1180;1080" dur="4s" repeatCount="indefinite"/></circle>
</g>
<g fill="none" stroke="url(#n)" filter="url(#g)" opacity=".7">
<ellipse cx="700" cy="215" rx="250" ry="90" stroke-width="2" stroke-dasharray="6 15"><animateTransform attributeName="transform" type="rotate" from="0 700 215" to="360 700 215" dur="12s" repeatCount="indefinite"/></ellipse>
<ellipse cx="700" cy="215" rx="330" ry="125" stroke-width="1.5" stroke-dasharray="2 24"><animateTransform attributeName="transform" type="rotate" from="360 700 215" to="0 700 215" dur="18s" repeatCount="indefinite"/></ellipse>
</g>
<g text-anchor="middle" font-family="Montserrat,Arial,sans-serif">
<text x="700" y="105" fill="#aeb5d2" font-size="18" font-weight="600" letter-spacing="8">WELCOME TO MY DIGITAL SPACE</text>
<text x="700" y="190" fill="#fff" font-size="58" font-weight="800" letter-spacing="4">YESWANTH</text>
<text x="700" y="240" fill="url(#n)" font-size="25" font-weight="700" letter-spacing="7">AI • CYBERSECURITY • EXPLORATION</text>
<text x="700" y="300" fill="#e1e5f5" font-size="17" letter-spacing="4">LEARN / EXPERIMENT / BUILD / SECURE</text>
</g>
<rect x="3" y="3" width="1394" height="424" rx="28" fill="none" stroke="url(#n)" stroke-width="2"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></rect>
</svg>