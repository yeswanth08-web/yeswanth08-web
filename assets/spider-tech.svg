<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02040a"/><stop offset=".5" stop-color="#07162f"/><stop offset="1" stop-color="#02040a"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadowBlur"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<rect width="1200" height="300" rx="24" fill="url(#bg)"/>

<!-- subtle animated background -->
<g opacity=".13" stroke="#58a6ff">
  <path d="M0 55H1200M0 110H1200M0 165H1200M0 220H1200M0 275H1200"/>
  <path d="M60 0V300M180 0V300M300 0V300M420 0V300M540 0V300M660 0V300M780 0V300M900 0V300M1020 0V300M1140 0V300"/>
</g>

<!-- hanging web -->
<path d="M600 0 L600 54" stroke="#fff" stroke-width="3" opacity=".8"/>
<path d="M600 48 Q585 62 570 48 M600 48 Q615 62 630 48" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/>

<!-- Spider-Man image from the user's supplied example -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 -95;0 0;0 -95" dur="2s" repeatCount="indefinite"/>
  <image href="https://i.ibb.co/XDFkXMx/spiderman-colgado.png" x="450" y="35" width="300" height="220" preserveAspectRatio="xMidYMid meet"/>
</g>

<!-- bouncing shadow -->
<ellipse cx="600" cy="270" rx="105" ry="17" fill="#000" opacity=".45" filter="url(#shadowBlur)">
  <animate attributeName="rx" values="105;62;105" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".45;.18;.45" dur="2s" repeatCount="indefinite"/>
</ellipse>

<!-- moving web strands -->
<g fill="none" stroke="#fff" opacity=".45" stroke-width="1.5" stroke-dasharray="7 8">
  <path d="M600 48 Q500 95 410 155 T250 280">
    <animate attributeName="stroke-dashoffset" values="0;-30" dur=".8s" repeatCount="indefinite"/>
  </path>
  <path d="M600 48 Q700 95 790 155 T950 280">
    <animate attributeName="stroke-dashoffset" values="0;-30" dur=".8s" repeatCount="indefinite"/>
  </path>
</g>

<!-- cinematic scan line -->
<rect x="20" y="20" width="4" height="260" rx="2" fill="#fff" opacity=".55" filter="url(#glow)">
  <animate attributeName="x" values="20;1180;20" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- small HUD -->
<g font-family="monospace" fill="#fff">
  <text x="35" y="42" font-size="14" opacity=".72">SPIDER_SCAN://ACTIVE</text>
  <text x="35" y="64" font-size="11" opacity=".45">AI • CYBERSECURITY • ANALYZING</text>
  <text x="1005" y="42" font-size="13" opacity=".72">THREAT MAP: LIVE</text>
  <text x="1005" y="64" font-size="11" opacity=".45">WEB LINK: ACTIVE</text>
</g>

<!-- pulse -->
<circle cx="600" cy="245" r="20" fill="none" stroke="#fff" opacity=".15">
  <animate attributeName="r" values="20;70;20" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".3;0;.3" dur="2.5s" repeatCount="indefinite"/>
</circle>
</svg>