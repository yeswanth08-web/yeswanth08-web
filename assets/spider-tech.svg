<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
    <stop offset=".5" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="260" rx="24" fill="#080b12"/>
<path d="M0 210 H1200 M0 150 H1200 M0 90 H1200" stroke="#fff" opacity=".045"/>
<path d="M80 0V260 M220 0V260 M360 0V260 M500 0V260 M640 0V260 M780 0V260 M920 0V260 M1060 0V260" stroke="#fff" opacity=".035"/>

<!-- scanning beam -->
<rect x="20" y="20" width="5" height="220" rx="3" fill="#fff" opacity=".7" filter="url(#glow)">
  <animate attributeName="x" values="20;1175;20" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- web lines -->
<g fill="none" stroke="#fff" opacity=".18">
  <path d="M600 130 L450 20 M600 130 L510 0 M600 130 L690 0 M600 130 L750 20"/>
  <path d="M600 130 L410 90 M600 130 L790 90 M600 130 L430 220 M600 130 L770 220"/>
</g>

<!-- original spider-tech character -->
<g filter="url(#glow)">
  <g>
    <animateTransform attributeName="transform" type="translate" values="-170 95;120 30;420 145;720 45;1040 135;1370 70" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="-8;4;-5;5;-3;0" dur="9s" repeatCount="indefinite"/>

    <!-- web trail -->
    <path d="M-70 85 Q-15 20 45 65" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="7 7">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur=".8s" repeatCount="indefinite"/>
    </path>

    <!-- head -->
    <circle cx="0" cy="0" r="24" fill="#0d111a" stroke="#fff" stroke-width="2"/>
    <path d="M-17 -7 Q0 -25 17 -7 M0 -23V23 M-22 4H22 M-14 15L14 -15 M14 15L-14 -15" fill="none" stroke="#fff" stroke-width="1" opacity=".65"/>

    <!-- body -->
    <path d="M-18 22 Q0 10 18 22 L27 78 Q0 96 -27 78Z" fill="#111722" stroke="#fff" stroke-width="2"/>
    <path d="M0 23V82 M-20 45H20 M-16 62H16" stroke="#fff" stroke-width="1" opacity=".55"/>

    <!-- arms -->
    <path d="M-17 30 L-65 55 L-92 38 M17 30 L65 55 L92 35" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <!-- legs -->
    <path d="M-18 75 L-55 112 L-78 100 M18 75 L55 112 L80 95" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>

    <!-- scanning visor -->
    <rect x="-15" y="-4" width="30" height="6" rx="3" fill="#fff">
      <animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>

<!-- HUD -->
<g fill="#fff" font-family="monospace" font-size="13" opacity=".65">
  <text x="35" y="42">NEURAL_SCAN://ACTIVE</text>
  <text x="965" y="42">TARGET: UNKNOWN</text>
  <text x="35" y="232">AI_CORE  ████████░░  82%</text>
  <text x="965" y="232">ROAMING...</text>
</g>

<circle cx="600" cy="130" r="34" fill="none" stroke="#fff" opacity=".12">
  <animate attributeName="r" values="25;70;25" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".35;0;.35" dur="2.5s" repeatCount="indefinite"/>
</circle>
</svg>